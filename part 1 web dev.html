
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="with=device-width , inital-scale=1.0">
    <title>VSO7 Clothing - NEW Collection</title>
    <link rel="proconnect" href="https://fonts.gooleapis.com">
    <link hef="https://fonts.googleapies.com/css2?family=Anton&family=Iner:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --black:#0a0a0a;
            --panel:#161616;
            --panel-2:#1f1f1f;
            --white:#f5f5f3;
            --grey:#8a8a86;
            --red:#e8332a;
            --line:rgba(245,245,243,0.2);
            --dispay:'Antor', sans-serif;
            --body:'inter', sans-serif;
            --mono:'Space Mono',monospace;
        }

        *{box-sizing:border-box;margin:0;padding:0;}

        html{ scroll-behavior:smooth;}

        body{
            background :var(--black);
            color:var(--white);
            font-family:var(--body);
            line-height:1.5;
            -webkit-font-smoothing:antialiased;
        }

        a{ color:inherit; text-decoration:none; }
        ul{ list-style:none; }
        img{ max-width:100%; display: block; }

        :focus-visible{
            outline:2px solid var(--red);
            outline-offset:3px;
        } 

        .wrap{
            max-width:1200px;
            margin:0 auto;
            padding:0 clamp(1,25rem, 4vw, 3rem );
        }

        /*-----Header-----*/
        header{
            position:sticky;
            top:0;
            z-index:50;
            background: rgba(10,10,10,0.9);
            backdrop-filter:blur(8px);
            border-bottom: 1px solid var(--line);
        }

        .nav{
            display:flex;
            align-items:center ;
            justify-content:space-between;
            padding:1.1rem 0;
        }

        .logo{
            font-family: var(--dispay);
            font-size: 1.6rem ;
            letter-spacing:0.04em;
        }

        .logo span {color:var(--red); }

        .nav-links{
            display: flex ;
            gap: 2.25rem;
            font-size:0.85rem;
            font-weight: 600;
            letter-spacing:0.14em;
            text-transform:uppercase;
        }

        .nav-links a{
            position:relative;
            padding-bottom:4px ;
        }
        .nav-links a::after{
            content:"";
            position:absplute;
            left:0; bottom:0;
            width:0; height: 2px;
            background : var(--red);
            transition:width .25s ease;
        }
        .nav-links a:hover::after,
        .nav-links a:focus-visible::after{width:100%; }

        .nav-cart{
            display:flex;
            align-items:center;
            gap:0.5rem;
            font-family: var(--mono);
            font-size:0.85rem;
            border:1px solid var(--line);
            padding:0.5rem 0.9rem;
            border-radius: 2px;
            background: transparent;
            color:var(--white);
            cursor:pointer;
        }
        .nav-cart:hover{border-color:var(--red); }
        .cart-count{
            background:var(--red);
            color:var(--black);
            font-weight: 700;
            border-radius: 50%;
            width:1.3rem; height: 1.3rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size:0.7rem;
        }

        .nav-toggle{
            display:none;
            background: none;
            border:0;
            color:var(--white);
            font-size: 1.6rem;
            cursor: pointer;
        }

        /*----HERO----*/
        .hero{
            position:relative;
            padding: clamp(3.5rem,10vw,7rem) 0 clamp(3rem,8vw,5rem);
            overflow: hidden;
            border-bottom:1px solid var(--line)
        }

        .hero-bg-slash{
            position: absolute;
            top: -20%; right: -10%;
            width:60%; height: 140%;
            background: linear-gradient(135deg, var(--red) 0%, transparent 70%);
            opacity: 0,18;
            transform: skewX(-12deg);
            pointer-events: none;
        }

        .eybrow{
            display: inline-flex;
            align-items: center;
            gap:0,6rem;
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing:0.18em;
            text-transform: uppercase;
            color:var(--red);
            margin-bottom: 1.25rem;
        }
        .eyebrow::before{
            content:"";
            width:1,6rem ; height: 1px;
            background: var(--red);
        }
        .hero h1 em{
            font-family: var(--display);
            font-size: clamp(2.8rem, 8vw,6rem);
            line-height:0,95 ;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            max-width: 14ch;
        }
        .hero h1 em{
            font-style: normal;
            color:var(--red);
        }

        .hero-sub{
            margin-top:1.5rem;
            max-width:38ch;
            color:var(--grey)
            font-size:1.05rem;
        }

        .hero-cta{
            margin-top:2.25rem;
            display:flex;
            gap:1rem;
            flex-wrap:wrap;
        }

        .btn{
            font-family: var(--mono);
            font-size:0.85rem;
            letter-spacing: 0.08rem;
            text-transform:uppercase;
            padding: 0.95rem 1.9rem;
            border-radius: 2px;
            border: 1px solid var(--white);
            cursor: pointer;
            transition: transform .15s ease, backround .2s ease, color .2s ease;
            display:inline-block;
        }
        .btn-primary{
            background: var(--red);
            border-color: var(--red);
            color: var(--black);
            font-weight: 700;
        }
        .btn-primary:hover{ transform:translateY(-2px);}
        .btn-ghost{
            background: transparent;
            color:var(--white);
        }
        .btn-ghost :hover{
            background: var(--white);
            color:var(--black);
        }

        .about-strip{
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items:center;
        }
        .about-strip .num{
            font-family: var(--mono);
            color:var(--red);
            font-size:0.8rem;
            letter-spacing:0,15em;
        }
